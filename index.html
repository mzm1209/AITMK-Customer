<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhatsApp 客服聊天工作台</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h1>客户会话</h1>
          <button id="refreshCustomersBtn" class="ghost-btn" type="button">刷新</button>
        </div>

        <label for="apiBaseUrl">Spring Boot 地址</label>
        <input id="apiBaseUrl" value="https://crm.wondermindedu.com:6153" />

        <label for="replyFrom">Reply From（业务号码ID）</label>
        <input id="replyFrom" placeholder="例如：1019964791197772" />

        <p class="muted">自动读取后端客户列表与消息记录。</p>

        <ul id="customer-list" class="customer-list"></ul>
      </aside>

      <section class="chat-panel">
        <header class="chat-header">
          <h2 id="chat-title">未选择客户</h2>
          <p id="conversation-window" class="muted">请选择左侧客户</p>
          <p id="connection-status" class="muted">等待连接</p>
        </header>

        <ul id="message-list" class="message-list"></ul>

        <form id="message-form" class="message-form" aria-label="发送消息">
          <textarea id="messageInput" rows="3" placeholder="输入人工回复内容..." required></textarea>
          <button type="submit" id="send-btn" disabled>发送人工回复</button>
        </form>
      </section>
    </main>

    <template id="customer-item-template">
      <li class="customer-item" role="button" tabindex="0">
        <div class="line-1">
          <span class="name"></span>
          <span class="time muted"></span>
        </div>
        <div class="line-2">
          <span class="preview muted"></span>
          <span class="badge"></span>
        </div>
      </li>
    </template>

    <template id="message-template">
      <li class="message-item">
        <p class="meta"></p>
        <p class="content"></p>
      </li>
    </template>

    <script src="app.js"></script>
  </body>
</html>
